services:
  auth-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: account_user
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: account_db
    ports:
      - "5451:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-app:
    build: .
    ports:
      - "8082:8080"
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=auth-db;Port=5432;User Id=auth_user;Password=securepassword;Database=auth_db;
      - DB_HOST=auth-db
    restart: unless-stopped

volumes:
  auth_db_data: